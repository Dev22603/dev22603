[build]
  base = "frontend"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Collapse the netlify.app subdomain into the canonical domain so
# search engines only ever see one indexable host.
[[redirects]]
  from = "https://dev-bachani.netlify.app/*"
  to = "https://dev-bachani.xyz/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
